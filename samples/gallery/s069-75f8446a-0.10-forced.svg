<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" role="img" aria-labelledby="t d"><title id="t">Kolavatar 9d07b8f12224e89a</title><desc id="d">11x11 sikku kolam, symmetry 2m_dm_d, palette pongal-festive. Kolavatar is built on the South Indian sikku kolam tradition.
Cultural and ethnographic context: Sahapedia (sahapedia.org/kolam-floor-art-of-tamil-nadu).
Algorithmic foundation: Siromoney, Siromoney, and Krithivasan, &#34;Array Grammars and Kolam,&#34;
Computer Graphics and Image Processing 3 (1974): 63-82.
Symmetry classification: Venkatraman Gopalan, &#34;Symmetry Classification and Enumeration of
Square-Tile Sikku Kolams,&#34; Journal of Mathematics and the Arts (2024); arXiv:2304.14134.
